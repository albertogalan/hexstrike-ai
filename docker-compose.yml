services:
  hexstrike-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hexstrike-ai-server
    restart: unless-stopped
    ports:
      - "8000:8000"  # Main API server
      - "8081:8080"  # Additional service port
      - "8091:8090"  # Web interface port
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - HEXSTRIKE_PORT=8000
      - HEXSTRIKE_DATA_DIR=/app/data
      - HEXSTRIKE_CACHE_DIR=/app/cache
      - HEXSTRIKE_LOGS_DIR=/app/logs
      - HEXSTRIKE_RESULTS_DIR=/app/results
      - CHROME_BIN=/usr/bin/chromium-browser
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
    volumes:
      - hexstrike-data:/app/data
      - hexstrike-cache:/app/cache
      - hexstrike-logs:/app/logs
      - hexstrike-results:/app/results
      - hexstrike-tmp:/app/tmp
    networks:
      - hexstrike-network
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_RAW  # For network scanning tools
      - NET_ADMIN  # For advanced network operations
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: hexstrike-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-hexstrike2024}
    volumes:
      - redis-data:/data
    networks:
      - hexstrike-network
    mem_limit: 256m

  # Optional: PostgreSQL for persistent data storage
  postgres:
    image: postgres:15-alpine
    container_name: hexstrike-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hexstrike}
      - POSTGRES_USER=${POSTGRES_USER:-hexstrike}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hexstrike2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hexstrike-network
    mem_limit: 512m

  # Optional: Nginx reverse proxy (commented out - create nginx/ directory first)
  # nginx:
  #   image: nginx:alpine
  #   container_name: hexstrike-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - hexstrike-logs:/var/log/nginx
  #   networks:
  #     - hexstrike-network
  #   depends_on:
  #     - hexstrike-ai
  #   mem_limit: 128m

volumes:
  hexstrike-data:
    driver: local
  hexstrike-cache:
    driver: local
  hexstrike-logs:
    driver: local
  hexstrike-results:
    driver: local
  hexstrike-tmp:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  hexstrike-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16