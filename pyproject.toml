[project]
name = "hexstrike-ai"
version = "6.0.0"
description = "HexStrike AI MCP Client - Enhanced AI Agent Communication Interface"
dependencies = [
    "flask>=2.3.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "psutil>=5.9.0,<6.0.0",
    "fastmcp>=0.2.0,<0.3.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "selenium>=4.15.0,<5.0.0",
    "webdriver-manager>=4.0.0,<5.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "mitmproxy>=9.0.0,<11.0.0",
    "pwntools>=4.10.0,<5.0.0",
    "angr>=9.2.0,<10.0.0"
]
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["hexstrike_mcp", "hexstrike_server"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"